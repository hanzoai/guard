name: deploy

# The hanzo-guard API reference is a SITE, not an App.
#
# It used to publish through actions/deploy-pages — .github/workflows/pages.yml
# ran `cargo doc` and handed target/doc to GitHub Pages, which served it from
# hanzoai.github.io/guard. That is a second deploy plane living outside our own
# CI/CD, outside the Sites plane, and outside our analytics, so it is gone.
#
#   cargo doc --no-deps -> target/doc
#     -> site
#
# The publish mechanics are NOT here. They are bin/site in hanzoai/ci,
# reached through its action, and every static surface in the fleet calls that one
# script — ensure-project, enqueue, presigned per-file upload, complete. A
# contract transcribed per repo is a contract that drifts, and this file used to
# carry its own copy of every call. It also SELF-PROVISIONS: the project is
# created idempotently before the enqueue, so committing this file is enough to
# stand the site up.
#
# Note this is the docs SITE only. ci.yml keeps building, testing, clippy-ing and
# fmt-checking the crate — including its own `cargo doc` gate, which is a
# compile check on the doc comments and NOT a publish. Those are lint/test lanes,
# not deploy planes, and they stay exactly where they are.

on:
  push:
    branches: [main]
    paths: ['src/**', 'Cargo.toml', 'README.md', '.hanzo/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    # NOT ubuntu-latest. These run on the in-cluster act_runner, whose fleet
    # advertises hanzo-build-linux-amd64. A label no runner answers does not
    # fail — it queues until the 24h timeout, which is silence, not an error.
    runs-on: hanzo-build-linux-amd64
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: build the static export
        run: |
          set -euo pipefail
          # dtolnay/rust-toolchain resolves through the GitHub Actions
          # marketplace, which the forge runner does not reach. rustup is the
          # toolchain's own installer and needs nothing but curl.
          if ! command -v cargo >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --profile minimal --default-toolchain stable
          fi
          . "$HOME/.cargo/env"
          cargo doc --all-features --no-deps
          # rustdoc writes no root index — every page lives under the crate's
          # own directory — so the site's / would 404 without this hop.
          # hanzo-guard's rustdoc directory is hanzo_guard: cargo replaces the
          # hyphen, and a redirect to the hyphenated name 404s.
          test -s target/doc/hanzo_guard/index.html || {
            echo "::error::rustdoc produced no target/doc/hanzo_guard/index.html"; exit 1; }
          printf '<meta http-equiv="refresh" content="0; url=hanzo_guard/index.html">\n' \
            > target/doc/index.html
          echo "exported $(find target/doc -type f | wc -l) files"

      # The ONE analytics wire: cloud's hosted tag (cloud apps/analytics/tag.go),
      # which posts the canonical batch to POST /v1/event. There is no GA, no
      # Plausible, no second tracker, and no vendored copy of the tag — it is
      # served from the origin that eats it so a page allowlists ONE host.
      #
      # The key is the project's OWN publishable key, read from the project this
      # run is about to deploy. It is never a checked-in constant: pk- is
      # write-only and publishable (same trust class as a Sentry DSN), so it
      # belongs in the page, but its authority is the project record, which means
      # rotation is one server-side change and not five repo edits.
      #
      # NO KEY => NO TAG, deliberately. A keyless beacon is accepted 200 into
      # $public, a reserved tenant this org cannot read, so silence is the honest
      # failure and we pick it over reporting into a tenant nobody reads.
      #
      # This is rustdoc's own HTML, which no template of ours can reach, so the
      # tag is stamped into the export. Same step, same shape, in every doc site
      # in this fleet.
      - name: wire the analytics tag
        env:
          DEPLOY_TOKEN: ${{ secrets.HANZO_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          KEY=$(curl -sS -H "Authorization: Bearer ${DEPLOY_TOKEN}" \
                  "https://api.hanzo.ai/v1/projects/guard" | jq -r '.key // empty')
          if [ -z "$KEY" ]; then
            echo "::warning::project guard exposes no publishable key — publishing untagged rather than beaconing into \$public"
            exit 0
          fi
          TAG="<script defer src=\"https://api.hanzo.ai/v1/event.js\" data-key=\"${KEY}\" data-product=\"guard\"></script>"
          find target/doc -name '*.html' -print0 | xargs -0 -r sed -i "s#</head>#${TAG}</head>#"
          echo "tagged $(grep -rl 'v1/event.js' target/doc | wc -l) pages"

      # ONE credential. The 202 carries a prefix-scoped, 30-minute presigned POST
      # grant, so nothing here holds a bucket key. Do NOT add SITES_S3_* — that is
      # the standing shared-bucket credential the grant replaced, and it could
      # overwrite every other org's site.
      - name: Publish to the Sites plane
        uses: hanzoai/ci/.github/actions/site@v1
        with:
          slug: guard
          dir: target/doc
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
